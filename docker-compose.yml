services:
  db:
    container_name: db_eye_alert
    image: mysql:9.1.0
    volumes:
      - vol_db_eye_alert:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: America/Lima
    restart: always

  eyealertbackend:
    container_name: api_eyealert
    depends_on:
      - db
    image: mrdevv24/api_eyealert:1.0.0
    ports:
      - "8081:8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USER_NAME: ${DB_USER_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EMAIL: ${EMAIL}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Lima
    restart: always

volumes:
  vol_db_eye_alert:
    external: false